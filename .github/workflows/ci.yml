name: canonical-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra test --python 3.11
      - run: make check
