style_id: CRR-NATURE-VIS-2026-07-19
target_journal: Nature Food
backend: python_matplotlib_only
status: FROZEN_BEFORE_RENDERING

dimensions_mm:
  single_column_width: 89
  double_column_width: 183
  maximum_height: 170
  figure_1: [183, 120]
  figure_2: [183, 150]
  figure_S1: [183, 140]
  figure_S2: [183, 105]
  figure_S3: [183, 120]

typography:
  family: [Arial, Helvetica, DejaVu Sans, sans-serif]
  body_pt: 6.8
  ticks_pt: 5.8
  legend_pt: 5.7
  panel_label_pt: 8.0
  svg_fonttype: none
  pdf_fonttype: 42

linework:
  axes_width_pt: 0.55
  data_line_width_pt: 1.2
  reference_line_width_pt: 0.75
  marker_edge_width_pt: 0.55
  error_cap_pt: 2.0

palette:
  charcoal: '#3D3539'
  cyan: '#0F9EA8'
  teal: '#008B82'
  steel_blue: '#45728F'
  mint: '#8CD1B2'
  muted_violet: '#8B84A3'
  paper: '#FFFFFF'

semantic_mapping:
  observed_acreage_and_neutral: charcoal
  relative_yield: cyan
  standardized_revenue: steel_blue
  operating_margin: teal
  total_cost_margin: muted_violet
  uncertainty_and_feasible_fill: mint
  risk_and_nonidentified: muted_violet
  universal_reversal: teal
  no_reversal: paper_with_charcoal_edge

redundant_encoding:
  ranking_definition: color_plus_hatch
  marginal_family: marker_shape
  reversal_state: fill_plus_edge
  evidence_boundary: line_style_plus_text

exports:
  primary: svg
  vector: [svg, pdf]
  raster: [tiff_600dpi, png_300dpi]
  deterministic_metadata_date: '2026-07-19'

prohibitions:
  - rainbow_colormap
  - 3d_chart
  - decorative_gradient
  - manually_adjusted_data_position
  - hidden_null_or_failed_convergence
  - result_claim_inside_plot_without_source
